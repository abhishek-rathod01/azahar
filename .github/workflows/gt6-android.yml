name: gt6-android

# Android-only build for the Azahar GT6 fork. Always produces an APK and uploads it as the
# artifact "azahar-gt6-<short-sha>[-testkey]".
#
#  * With the repo secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS the
#    APK is signed with the permanent release key.
#  * Without them it is signed with a throw-away test key ("-testkey" in every name). That key is
#    kept in the Actions cache so consecutive builds can update each other. GitHub drops cache
#    entries that were not used for 7 days; after that the next build gets a new key and Android
#    refuses to update over the old install, so the app has to be uninstalled once.
#
# A manual run with "release" ticked also publishes the APK as a GitHub pre-release, which is a
# direct download link (no zip, no login needed on the phone to tap it).

on:
  push:
    branches: [ gt6 ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build (empty = the commit this run was started on)"
        required: false
        default: ""
      release:
        description: "Also publish the APK as a GitHub pre-release (direct download)"
        type: boolean
        default: false
      release_title:
        description: "Title of that release (empty = 'Azahar Optimised <short-sha>')"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gt6-android-${{ github.ref }}
  cancel-in-progress: false # queue instead: cancelling a native build also loses its cache save

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # only used by the optional release step
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      # Decides which key signs the APK. A release build without a keystore falls back to the
      # debug key, which is what the test-key mode relies on.
      - name: Check signing secrets
        id: secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set: this APK is signed with the cached TEST key (file names end in -testkey)."
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-gt6-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gt6-android-

      # Test-key mode: the workflow makes its own key in a folder it controls and keeps that folder
      # in the Actions cache, so every later build signs with the same key. (The first attempt
      # cached ~/.android/debug.keystore, but the build never wrote the key there, so each build
      # got a new key.) The key is saved right after it is created, not at the end of the job, so
      # a later failing step cannot lose it.
      - name: Restore test signing key
        if: steps.secrets.outputs.have_secrets != 'true'
        id: testkey_cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gt6-testkey
          key: ${{ runner.os }}-gt6-testkey-v2

      - name: Prepare test signing key
        if: steps.secrets.outputs.have_secrets != 'true'
        run: |
          set -e
          DIR="${HOME}/.gt6-testkey"
          mkdir -p "${DIR}"
          if [ -s "${DIR}/test.jks" ] && [ -s "${DIR}/pass.txt" ]; then
            echo "Reusing the cached test key"
          else
            echo "Creating a new test key (no cache entry yet)"
            rm -f "${DIR}/test.jks"
            openssl rand -hex 16 > "${DIR}/pass.txt"
            "${JAVA_HOME_17_X64}/bin/keytool" -genkeypair -storetype PKCS12 \
              -keystore "${DIR}/test.jks" -alias gt6test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat "${DIR}/pass.txt")" -keypass "$(cat "${DIR}/pass.txt")" \
              -dname "CN=Azahar GT6 test key, O=GT6 fork, C=XX"
          fi
          echo "::add-mask::$(cat "${DIR}/pass.txt")"

      - name: Save new test signing key
        if: steps.secrets.outputs.have_secrets != 'true' && steps.testkey_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gt6-testkey
          key: ${{ runner.os }}-gt6-testkey-v2

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Build (assembleVanillaRelease)
        env:
          HAVE_SECRETS: ${{ steps.secrets.outputs.have_secrets }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -ex
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export NDK_CCACHE="$(which ccache)"
          if [ "${HAVE_SECRETS}" = "true" ]; then
            export ANDROID_KEYSTORE_FILE="${RUNNER_TEMP}/gt6-release.jks"
            base64 --decode <<< "${ANDROID_KEYSTORE_B64}" > "${ANDROID_KEYSTORE_FILE}"
          else
            # Test-key mode goes through the same Gradle signing settings as the release key
            export ANDROID_KEYSTORE_FILE="${HOME}/.gt6-testkey/test.jks"
            ANDROID_KEYSTORE_PASS="$(cat "${HOME}/.gt6-testkey/pass.txt")"
            export ANDROID_KEYSTORE_PASS
            export ANDROID_KEY_ALIAS=gt6test
          fi
          cd src/android
          chmod +x ./gradlew
          ./gradlew assembleVanillaRelease
          ccache -s -v
          if [ "${HAVE_SECRETS}" = "true" ]; then rm -f "${ANDROID_KEYSTORE_FILE}"; fi

      # A mismatch between a Kotlin `external fun` and the exported C symbol only shows up on the
      # phone as UnsatisfiedLinkError, so compare them here.
      - name: Verify JNI exports of the GT6 Kotlin objects
        run: |
          set -e
          NM="${ANDROID_SDK_ROOT}/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          [ -x "$NM" ] || { echo "::error::llvm-nm not found at $NM"; exit 1; }
          LIB="$(find src/android/app/build -name libcitra-android.so | head -n 1)"
          [ -n "$LIB" ] || { echo "::error::libcitra-android.so not found"; exit 1; }
          echo "checking $LIB"
          "$NM" -D --defined-only "$LIB" > "$RUNNER_TEMP/syms.txt"
          DIR=src/android/app/src/main/java/org/citra/citra_emu/utils
          missing=0
          checked=0
          for cls in PerfLog FramePacing; do
            KT="$DIR/$cls.kt"
            if [ ! -f "$KT" ]; then echo "$cls.kt not in this commit, skipping"; continue; fi
            for fn in $(grep -oE 'external fun native[A-Za-z]+' "$KT" | awk '{print $3}'); do
              checked=$((checked + 1))
              if grep -q "Java_org_citra_citra_1emu_utils_${cls}_${fn}\$" "$RUNNER_TEMP/syms.txt"; then
                echo "ok   $cls.$fn"
              else
                echo "::error::$cls.$fn has no exported JNI symbol"
                missing=1
              fi
            done
          done
          echo "$checked JNI functions checked"
          exit $missing

      - name: Locate and verify APK
        id: apk
        env:
          HAVE_SECRETS: ${{ steps.secrets.outputs.have_secrets }}
        run: |
          set -ex
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          SUFFIX=""
          if [ "${HAVE_SECRETS}" != "true" ]; then SUFFIX="-testkey"; fi
          mkdir -p out
          APK_DIR=src/android/app/build/outputs/apk/vanilla/release
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -name '*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 APK in $APK_DIR, found ${#APKS[@]}"
            ls -R src/android/app/build/outputs/apk || true
            exit 1
          fi
          APK_NAME="azahar-optimised-${SHORT_SHA}${SUFFIX}.apk"
          cp "${APKS[0]}" "out/${APK_NAME}"
          # R8 is enabled for release: keep the mapping so crash traces can be de-obfuscated
          MAPPING=src/android/app/build/outputs/mapping/vanillaRelease/mapping.txt
          if [ -f "$MAPPING" ]; then cp "$MAPPING" "out/mapping-${SHORT_SHA}${SUFFIX}.txt"; fi
          apksigner verify --verbose --print-certs "out/${APK_NAME}" | tee out/signature.txt
          if [ "${HAVE_SECRETS}" = "true" ] && grep -q "Android Debug" out/signature.txt; then
            echo "::error::APK is signed with the debug key although the release keystore was configured"
            exit 1
          fi
          (cd out && sha256sum "${APK_NAME}" | tee sha256.txt)
          # What Android will read from the APK (informational: a missing aapt2 does not fail the build)
          AAPT2="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${AAPT2}" ]; then
            "${AAPT2}" dump badging "out/${APK_NAME}" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):" | tee out/badging.txt || true
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### azahar-gt6-${SHORT_SHA}${SUFFIX}"
            if [ "${HAVE_SECRETS}" = "true" ]; then
              echo "Signed with the **permanent release key**."
            else
              echo "Signed with the cached **test key**. Builds from this branch can update each other while the cache lives; the permanent key needs the three repo secrets."
            fi
            echo '```'
            cat out/sha256.txt
            grep -E "certificate SHA-256 digest|Verified using" out/signature.txt || true
            cat out/badging.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azahar-gt6-${{ steps.apk.outputs.short_sha }}${{ steps.apk.outputs.suffix }}
          path: out/
          retention-days: 30

      # A release is a direct, tap-to-download .apk link. The text inputs go through env vars, never
      # straight into the script.
      - name: Publish GitHub pre-release
        id: release
        if: inputs.release == true
        continue-on-error: true # the APK is already in the artifact; a refused release must not fail the build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAVE_SECRETS: ${{ steps.secrets.outputs.have_secrets }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
          SUFFIX: ${{ steps.apk.outputs.suffix }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -ex
          TAG="gt6-${SHORT_SHA}${SUFFIX}"
          FULL_SHA="$(git rev-parse HEAD)"
          TITLE="${RELEASE_TITLE:-Azahar Optimised ${SHORT_SHA}}"
          if [ "${HAVE_SECRETS}" = "true" ]; then
            KEYNOTE="Signed with the permanent release key."
          else
            KEYNOTE="Signed with a TEST key kept in the Actions cache. Updating over an older build of this fork works as long as the key is unchanged; if Android says the app conflicts with an existing package, uninstall the old copy once (the app's own switches reset; copy your Azahar user folder somewhere first to be safe)."
          fi
          {
            echo "Built by GitHub Actions from commit \`${FULL_SHA}\` of this fork (run ${GITHUB_RUN_ID})."
            echo
            echo "${KEYNOTE}"
            echo
            echo "Package \`org.azahar_emu.azahar.gt6\`: installs next to the official Azahar, never over it."
            echo "Not tested on a device when published; see CHANGES.md and docs/GT6-TEST-ROUNDS.md in the repo."
            echo
            echo "SHA-256:"
            echo '```'
            cat out/sha256.txt
            echo '```'
          } > out/release-notes.md
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "out/${APK_NAME}" out/sha256.txt --clobber
          else
            gh release create "${TAG}" "out/${APK_NAME}" out/sha256.txt \
              --target "${FULL_SHA}" --prerelease --title "${TITLE}" --notes-file out/release-notes.md
          fi
          URL="$(gh release view "${TAG}" --json url --jq .url)"
          echo "Release: ${URL}"
          echo "### Release: ${URL}" >> "$GITHUB_STEP_SUMMARY"

      # Shows what the build token is allowed to do when the release was refused.
      - name: Why the release failed
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "::warning::The GitHub release could not be created. The APK is still in this run's artifact."
          gh api "repos/${GH_REPO}" --jq '{full_name, fork, archived, token_can_push: .permissions.push, token_is_admin: .permissions.admin}' || true
          {
            echo "### The release could not be created"
            echo "The APK is in this run's artifact. In the fork's *Settings > Actions > General > Workflow permissions*, choose *Read and write permissions* and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
